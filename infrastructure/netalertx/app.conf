# NetAlertX Configuration for nixonhouse LAN
# Apply via: Settings > Restore/Import Config in the UI,
# or drop into the config/ volume mount and restart the container.
#
# UI path for each setting group is noted inline.

# ---------------------------------------------------------------------------
# NETWORK SCANNING
# Settings > General > Scan Settings
# ---------------------------------------------------------------------------

# Full /22 covers 192.168.68.0 – 192.168.71.255.
# If arp-scan misses devices, split into individual /24 subnets:
#   SCAN_SUBNETS = ['192.168.68.0/24','192.168.69.0/24','192.168.70.0/24','192.168.71.0/24']
SCAN_SUBNETS       = ['192.168.68.0/22']

# Scan every 5 minutes — aggressive enough to catch new devices quickly,
# not so fast that DHCP-churning IoT devices flood offline/online events.
SCAN_CYCLE_MINUTES = 5

# How many consecutive missed scans before a device is marked offline.
# 3 × 5 min = 15-minute grace window. Prevents phones/laptops from
# triggering "Down" alerts on brief sleeps.
DEV_OFFLINE_SCANS_THRESHOLD = 3

# ---------------------------------------------------------------------------
# ALERT TYPES
# Settings > General > Notifications
# ---------------------------------------------------------------------------

# ENABLE: Alert when a device not in the database appears on the network.
NEWDEV_NOTIFY      = True

# ENABLE: Alert when infrastructure devices (marked as "Favorites" in the UI)
# have been offline for more than DEV_OFFLINE_SCANS_THRESHOLD scans.
DEVDOWN_NOTIFY     = True

# DISABLE: "Device back online" is low-signal noise for most devices.
# Re-enable only if you want confirmation that infra came back after an outage.
DEVUP_NOTIFY       = False

# DISABLE: DHCP lease events are extremely chatty on a /22 with IoT gear.
DHCP_NOTIFY        = False

# ---------------------------------------------------------------------------
# SCANNER PLUGINS
# Settings > Plugins
# ---------------------------------------------------------------------------

# ARP scan — the most reliable, lowest noise scanner. Keep on.
ARPSCAN_RUN        = True

# NMAP — adds OS fingerprinting but is slower and can generate extra "new port"
# alerts. Leave off unless you specifically want port/service discovery.
NMAP_RUN           = False

# Pi-hole integration — disable unless you have Pi-hole on this host.
PIHOLE_RUN         = False

# UniFi integration — disable unless running UniFi Controller locally.
UNIFI_RUN          = False

# DHCP leases — reads lease file from local dnsmasq/DHCP server.
# Disable if your DHCP is on the Deco mesh (not this host).
DHCPLEASES_RUN     = False

# ---------------------------------------------------------------------------
# DATA RETENTION
# Settings > General > Maintenance
# ---------------------------------------------------------------------------

# Keep alert records for 30 days. Older records will be purged automatically.
# Reduce further (e.g. 14) once the backlog is cleared and noise is low.
PREF_KEEP_ALRTS    = 30

# Keep device history entries for 90 days.
PREF_KEEP_EVNT     = 90

